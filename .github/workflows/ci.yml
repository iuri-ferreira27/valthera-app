name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/Valthera.Tests/Valthera.Tests.csproj
      - name: Build (API and tests)
        run: dotnet build tests/Valthera.Tests/Valthera.Tests.csproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/Valthera.Tests/Valthera.Tests.csproj -c Release --no-build

  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI workload
        run: dotnet workload install maui-windows
      - name: Build app
        run: dotnet build src/Valthera.App/Valthera.App.csproj -c Release
